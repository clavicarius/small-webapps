<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0d1117"></stop>
            <stop offset="100%" stop-color="#161b22"></stop>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1280" height="640" fill="url(#bg)"></rect>

    <!-- Decorative circles -->
    <circle cx="180" cy="120" r="180" fill="#238636" opacity="0.08"></circle>
    <circle cx="1120" cy="520" r="220" fill="#2f81f7" opacity="0.06"></circle>

    <!-- Icon -->
    <g transform="translate(220,170)" filter="url(#shadow)">

        <!-- Globe -->
        <circle cx="120" cy="120" r="90" fill="none" stroke="#58a6ff" stroke-width="10"></circle>

        <ellipse cx="120" cy="120" rx="55" ry="90" fill="none" stroke="#58a6ff" stroke-width="6"></ellipse>

        <ellipse cx="120" cy="120" rx="90" ry="35" fill="none" stroke="#58a6ff" stroke-width="6"></ellipse>

        <line x1="30" y1="120" x2="210" y2="120" stroke="#58a6ff" stroke-width="6"></line>

        <!-- Cursor -->
        <path d="
            M170 65
            L245 185
            L210 180
            L230 235
            L205 245
            L185 190
            L155 215
            Z" fill="#ffffff"></path>
    </g>

    <!-- Title -->
    <text x="500" y="255" fill="#f0f6fc" font-size="62" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="700">
        Small Web Apps
    </text>

    <!-- Subtitle -->
    <text x="500" y="325" fill="#8b949e" font-size="30" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
        Collection of small web applications and helper utilities
    </text>

    <!-- Accent line -->
    <rect x="500" y="360" width="300" height="6" rx="3" fill="#238636"></rect>
</svg>